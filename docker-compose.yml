# Production stack: PostgreSQL, one-shot migrations, portal web server, background worker, nginx (TLS).
# Usage: cp .env.example .env, fill it in, put TLS certificates in docker/certs, then `docker compose up -d --build`.
name: cysoc-portal

x-app: &app
  build: .
  image: cysoc-portal:1.0.1
  env_file: .env
  environment:
    DATABASE_URL: postgres://portal_app:${PORTAL_APP_PASSWORD}@db:5432/cysoc_portal
    STORAGE_DIR: /data/reports
  volumes:
    - reports:/data/reports
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [backend]

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORTAL_OWNER_PASSWORD: ${PORTAL_OWNER_PASSWORD}
      PORTAL_APP_PASSWORD: ${PORTAL_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/10-portal.sql:ro
    healthcheck:
      # TCP check: during first-time initialisation PostgreSQL listens only on a local socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cysoc_portal"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *app
    command: ["node", "dist/server/src/scripts/migrate.js"]
    environment:
      DATABASE_OWNER_URL: postgres://portal_owner:${PORTAL_OWNER_PASSWORD}@db:5432/cysoc_portal
      APP_DB_USER: portal_app
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["node", "dist/server/src/worker.js"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: unless-stopped
    networks: [backend, frontend]

  # Optional malware scanning of uploaded reports: `docker compose --profile clamav up -d`
  # and set CLAMAV_HOST=clamav in .env.
  clamav:
    image: clamav/clamav:1.4
    profiles: [clamav]
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  reports:

networks:
  backend:
    internal: true
  frontend:
