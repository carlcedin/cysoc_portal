# TLS front for the portal. Certificates: docker/certs/portal.crt and docker/certs/portal.key
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 60m;            # keep slightly above UPLOAD_MAX_MB
  client_body_timeout 60s;
  # Second layer of brute-force protection in front of the app's own limits.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream portal { server app:8080; keepalive 16; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location = /api/auth/login { limit_req zone=auth burst=5 nodelay; proxy_pass http://portal; }
    location /api/auth/mfa/    { limit_req zone=auth burst=5 nodelay; proxy_pass http://portal; }
    location /ack/             { limit_req zone=auth burst=10 nodelay; proxy_pass http://portal; }
    location /api/reports/upload { proxy_request_buffering off; proxy_pass http://portal; }
    location /api/             { limit_req zone=api burst=40 nodelay; proxy_pass http://portal; }
    location /                 { proxy_pass http://portal; }
  }
}
